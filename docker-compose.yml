# Coolify: Docker Compose
# - App + PostgreSQL
# - Named volume durus-pgdata survives image/redeploy updates
# - Proxy must allow WebSocket upgrade on /ws

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-durus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-durus}
      POSTGRES_DB: ${POSTGRES_DB:-durus}
    volumes:
      - durus-pgdata:/var/lib/postgresql/data
    ports:
      # Local/dev only (loopback). App reaches db via internal hostname `db`.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  durus:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      STATIC_DIR: /app/static
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: postgres://${POSTGRES_USER:-durus}:${POSTGRES_PASSWORD:-durus}@db:5432/${POSTGRES_DB:-durus}?sslmode=disable
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 25s

volumes:
  durus-pgdata:
