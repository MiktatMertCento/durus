<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" role="img">
  <title>Ayakta çalış</title>
  <defs>
    <style>
      .glow { fill: #d6c496; opacity: 0.5; }
      .ink { fill: #6e4520; }
      .mid { fill: #8a5a2b; }
      .soft { fill: #f7f1e6; }
      .line {
        fill: none;
        stroke: #6e4520;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .figure { transform-box: fill-box; transform-origin: 118px 254px; animation: sway 3.8s ease-in-out infinite; }
      .arm { transform-box: fill-box; transform-origin: left center; animation: reach 2.8s ease-in-out infinite; }
      @keyframes sway {
        0%, 100% { transform: rotate(-1.2deg); }
        50% { transform: rotate(1.2deg) translateY(-2px); }
      }
      @keyframes reach {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-5deg); }
      }
    </style>
  </defs>

  <circle class="glow" cx="160" cy="156" r="128"/>
  <ellipse cx="160" cy="276" rx="96" ry="12" fill="#6e4520" opacity="0.1"/>

  <!-- standing desk (taller surface) -->
  <g class="desk">
    <rect class="ink" x="168" y="136" width="104" height="14" rx="7"/>
    <rect class="mid" x="192" y="150" width="11" height="110" rx="5"/>
    <rect class="mid" x="236" y="150" width="11" height="110" rx="5"/>
    <rect class="mid" x="182" y="252" width="76" height="8" rx="4" opacity="0.55"/>
    <rect class="ink" x="188" y="72" width="64" height="50" rx="12"/>
    <rect class="soft" x="196" y="80" width="48" height="32" rx="7"/>
    <rect class="mid" x="210" y="122" width="18" height="14" rx="4"/>
  </g>

  <!-- upright standing figure -->
  <g class="figure">
    <circle class="ink" cx="118" cy="68" r="20"/>
    <path class="line" d="M118 90v96" stroke-width="15"/>
    <g class="arm">
      <path class="line" d="M118 118c28-2 48 4 64 14" stroke-width="12"/>
    </g>
    <path class="line" d="M118 186l-18 68" stroke-width="13"/>
    <path class="line" d="M118 186l18 68" stroke-width="13"/>
    <path class="line" d="M88 256h24M124 256h24" stroke-width="9" opacity="0.5"/>
  </g>
</svg>
